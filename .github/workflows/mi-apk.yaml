name: Crear Mi APK

on:
  workflow_dispatch:
  push:
    branches: [ develop, main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Crear keystore si no existe
        run: |
          if [ ! -f android/app/upload.jks ]; then
            keytool -genkeypair -v -keystore android/app/upload.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload -storepass android -keypass android \
              -dname "CN=AnxReader,O=Anx,C=MX"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/app/upload.jks
            git commit -m "build: agregar keystore de firma [skip ci]"
            git push
          fi

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Preparar archivos del proyecto
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Compilar APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --tree-shake-icons --build-number=${{ github.run_number }}

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Anx-Reader-Con-Vision-APK
          path: build/app/outputs/flutter-apk/*.apk
