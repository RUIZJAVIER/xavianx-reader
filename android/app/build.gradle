plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Firma fija de release: el keystore vive en el repo (android/app/upload-keystore.jks)
// para que todas las compilaciones tengan exactamente la misma firma y Android
// permita instalar cada APK nuevo encima del anterior sin desinstalar.
def releaseStoreFile = keystoreProperties['storeFile']
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
        releaseStoreFile != null && file(releaseStoreFile).exists()

android {
    namespace "com.anxcye.anx_reader"
    // compileSdk flutter.compileSdkVersion
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.anxcye.anx_reader"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(releaseStoreFile)
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Mismo keystore en cada build => misma firma => actualización encima de la app anterior.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            if (!hasReleaseKeystore) {
                logger.warn("AVISO: no se encontró android/key.properties o el keystore de release; " +
                        "se firmará con la clave de debug (los APK no serán actualizables entre builds).")
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiVersionCode = 0
            if (output.getFilter(com.android.build.OutputFile.ABI) != null) {
                def abiName = output.getFilter(com.android.build.OutputFile.ABI)
                switch(abiName) {
                    case "armeabi-v7a":
                        abiVersionCode = 0 
                        break
                    case "arm64-v8a":
                        abiVersionCode = 0
                        break
                    case "x86":
                        abiVersionCode = 0
                        break
                    case "x86_64":
                        abiVersionCode = 0
                        break
                }
            }
            output.versionCodeOverride = flutterVersionCode.toInteger() + abiVersionCode
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
